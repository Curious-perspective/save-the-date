name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Where the site lives. Defaults: the GitHub Pages address (/save-the-date/). For the couple's own domain set
          # the repository variables SITE_BASE=/ and SITE_URL=https://shreyakshay.com/ (and the Pages custom domain).
          BASE_PATH: ${{ vars.SITE_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://curious-perspective.github.io/save-the-date/v2/' }}
          VITE_SITE_IMG: ${{ vars.SITE_URL || 'https://curious-perspective.github.io/save-the-date/' }}
          # where RSVPs are sent (the Google Sheet's web-app link); set as a repository variable
          VITE_RSVP_URL: ${{ vars.VITE_RSVP_URL }}
      # On the couple's own domain the story itself is the front page (the older v1 moves to /v1/)
      - if: ${{ vars.SITE_BASE == '/' }}
        run: mkdir -p dist/v1 && mv dist/index.html dist/v1/index.html && cp dist/v2/index.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
